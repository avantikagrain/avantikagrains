<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Avantika Grain Mills">
  <!--
    Browser tab icon.

    A wheat ear, drawn as a stand-in until the client supplies real logo
    files (see IMAGE-MANIFEST.md). It is deliberately simple: at 16px the
    only things that survive are the silhouette and the colour, so the
    grains are large and the stem is a single heavy stroke.

    Next picks this file up by name — app/icon.svg — and emits the
    <link rel="icon"> itself, so nothing in layout.tsx references it.
  -->
  <rect width="64" height="64" rx="14" fill="#1e4430"/>

  <g stroke="#d9b65a" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Stem, running the full height so the mark reads as an ear on a
         stalk rather than a shrub. -->
    <path d="M32 56V20"/>
  </g>

  <g fill="#f0d79a">
    <!--
      Grains: narrow and canted, in three opposed pairs that tighten and
      rise toward a single tip. Narrow is what distinguishes wheat from a
      leaf cluster at small sizes — round grains read as clover.
    -->
    <ellipse cx="25" cy="44" rx="3.4" ry="6.6" transform="rotate(-36 25 44)"/>
    <ellipse cx="39" cy="44" rx="3.4" ry="6.6" transform="rotate(36 39 44)"/>
    <ellipse cx="25.8" cy="35" rx="3.4" ry="6.6" transform="rotate(-30 25.8 35)"/>
    <ellipse cx="38.2" cy="35" rx="3.4" ry="6.6" transform="rotate(30 38.2 35)"/>
    <ellipse cx="26.8" cy="26" rx="3.3" ry="6.2" transform="rotate(-24 26.8 26)"/>
    <ellipse cx="37.2" cy="26" rx="3.3" ry="6.2" transform="rotate(24 37.2 26)"/>
    <ellipse cx="32" cy="16.5" rx="3.5" ry="7.5"/>
  </g>
</svg>
